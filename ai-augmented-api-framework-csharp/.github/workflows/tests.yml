name: API Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      ENV: ${{ vars.ENV || 'dev' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - name: Run tests
        run: dotnet test --no-restore --logger "trx;LogFileName=results.trx" --results-directory reports
      - name: AI summary (only when key is set)
        if: always() && env.OPENAI_API_KEY != ''
        run: dotnet test --no-restore --filter "Name=AnalyzeReport"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 30
